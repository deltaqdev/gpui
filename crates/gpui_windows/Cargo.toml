[package]
name = "gpui-pre-windows"
version = "0.3.6"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_windows"
path = "src/gpui_windows.rs"
doctest = false

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "scap"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
etagere.workspace = true
futures.workspace = true
gpui_util.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
uuid.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-numerics = "0.3"
windows-registry.workspace = true

[target.'cfg(target_os = "windows")'.dependencies.scap]
workspace = true
optional = true

# A dependency does not inherit this crate's `cfg(test)`, so the
# test-support APIs this crate implements under `cfg(test)` must be enabled
# on gpui for test builds.
[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-registry.workspace = true

[package.metadata.cargo-shear]
ignored = ["scap"]
