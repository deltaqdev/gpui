# Check that the docs site in site/ builds. Deployment to gpui.deltaq.dev is
# done by Vercel's Git integration, not by this workflow.
name: Docs site

on:
  pull_request:
    paths:
      - "site/**"
      - "crates/gpui/docs/**"
      - "crates/gpui/README.md"
      - "deltaq/CONVENTIONS.md"
      - "deltaq/changes.toml"
      - ".github/workflows/deltaq-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
