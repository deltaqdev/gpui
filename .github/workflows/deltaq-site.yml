# Build the docs site from site/ and publish it to GitHub Pages (gpui.deltaq.dev).
name: Docs site

on:
  push:
    branches: [gpui]
    paths: ["site/**", "crates/gpui/docs/**", "crates/gpui/README.md", "deltaq/CONVENTIONS.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - run: mdbook build site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
