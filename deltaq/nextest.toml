# Used by CI in place of upstream's .config/nextest.toml, whose overrides name
# crates this fork strips, which nextest rejects as a config error.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
# These tests assert on wall-clock durations tuned for upstream's dedicated CI
# machines and fail intermittently on GitHub's hosted runners:
# - gpui bench_context: sleep durations on macOS (a 10ms poll measured as 89ms).
# - util process::windows_tests: a 5s PowerShell cold-start deadline on Windows.
default-filter = '''
not (package(gpui) and test(/^app::bench_context::/))
and not (package(util) and test(/^process::windows_tests::/))
'''
