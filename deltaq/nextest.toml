# Used by CI in place of upstream's .config/nextest.toml, whose overrides name
# crates this fork strips, which nextest rejects as a config error.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
# bench_context tests assert on wall-clock sleep durations, which GitHub's
# macOS runners do not keep precise enough; upstream runs them on faster
# dedicated machines. They cover benchmark harness code only.
default-filter = 'not (package(gpui) and test(/^app::bench_context::/))'
